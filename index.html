<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
   <link rel="apple-touch-icon" sizes="180x180" href="images/Favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/Favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/Favicon/favicon-16x16.png">
    <link rel="manifest" href="images/Favicon/site.webmanifest">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    
    <section class="container">
        <header>
            <div class="logo">
            <a href="index.html">
                <img src="images/logo_black.png" alt="Planet Logo">
            </a>
            </div>

            <div class="toggle">
                <a href="#" class="switch">
                <span class="dark">Dark</span>
                <span class="moon">
                    <img src="images/Theme Icon.png" alt="Moon toggle">
                </span>
                </a>
            </div>
        </header>

        <main>
            <div class="search-container">
                <img src="Images/Search Icon.png" alt="search icon">
                <input type="text" placeholder="Search planet name">
                <a href="#" class="btn">Search</a>
            </div>

            <section class="hero">

                <div class="Planet-card">
                    <div class="planet-image">
                        <img src="images/Profile Picture.png" alt="" class="space-img">
                    </div>

                    <div class="planet-info">
                    <h1>Earth</h1>
                    <span class="planet-type">Terrestial</span>
                        <div class="description">
                        <p>The only known planet to support life, with liquid 
                            <br>water on its surface.</p>
                        </div>

                        <div class="main-stats">
                            
                            <div class="stat">
                                <span>Gravity</span>
                                <strong>9.8</strong>
                            </div>

                            <div class="stat">
                                <span>Mass</span>
                                <strong>0.00315</strong>
                            </div>

                            <div class="stat">
                                <span>Period</span>
                                <strong>365</strong>
                            </div>
                        </div>

                        <div class="oter-stats">

                            <div class="detail">
                                <img src="images/" alt="thermometer icon">
                                <span>288</span>
                            </div>

                            <div class="detail">
                                <img src="images/Half moon.png" alt="moon icon">
                                <span>1</span>
                            </div>

                            <div class="detail">
                                <img src="images/Diameter.png" alt="circle icon">
                                <span>12756</span>
                            </div>

                            <div class="detail">
                                <img src="images/Company Icon.png" alt="sun icon">
                                <span>288</span>

                            </div>
                        </div>
                    </div>
                </div>

            </section>


    </section>

    <script src="scripts/scripts.js"></script>
  </body>
</html>
